# Render Blueprint. render.com → New → Blueprint → осы репоны таңда,
# қалғанын Render осы файлдан оқиды. Әр git push сайын қайта деплой болады.
#
# Дерек Supabase-тегі (немесе кез келген) Postgres-те тұрады, сондықтан
# тегін жоспар жетеді әрі дерек деплой сайын жоғалмайды. Диск қажет емес.
#
# DATABASE_URL — құпия мән, сондықтан бұл файлда жазылмайды. Render
# панелінде Environment бөлімінде қолмен қоясың (sync: false соны білдіреді).
services:
  - type: web
    name: focus10
    runtime: node
    plan: free
    # Supabase жобасы ap-northeast-1 (Токио) аймағында тұр. Singapore —
    # Render-дің соған ең жақын тегін аймағы: app ↔ дерекқор ~70 мс.
    # Frankfurt болса, әр сұраныс Токиоға 230 мс жүріп қайтар еді.
    region: singapore
    # --include=dev міндетті: төменде NODE_ENV=production тұр, ал ол кезде
    # `npm ci` devDependency-лерді өткізіп жібереді. Vite мен Tailwind — дәл
    # сол devDependency-лер, сондықтан онсыз build «vite: command not found»
    # деп құлайды.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
      # «Бүгін» мен «осы апта» осы белдеумен есептеледі
      - key: APP_TZ
        value: Asia/Almaty
      # Supabase → Project Settings → Database → Connection string
      - key: DATABASE_URL
        sync: false
