# Render Blueprint. render.com → New → Blueprint → осы репоны таңда,
# қалғанын Render осы файлдан оқиды. Әр git push сайын қайта деплой болады.
#
# ЕСКЕРТУ — дерек тұрақтылығы туралы
# Бұл конфигурация тегін жоспарға бапталған. Render тегін web service-ке
# тұрақты диск бермейді (https://render.com/docs/disks — диск тек ақылы
# жоспарларда). Сондықтан SQLite файлы контейнердің уақытша жүйесінде тұрады:
#   • қайта деплой жасалса,
#   • сервис белсенсіздіктен ұйқыға кетіп қайта оянса,
# барлық қолданушы, тапсырма және уақыт жазбасы өшеді.
# Демо сілтеме ретінде жарайды, нағыз қолданысқа жарамайды.
#
# Дерек сақталуы керек болса екі жол бар:
#
# 1) Ақылы жоспар + диск (~$7/ай). plan-ды starter етіп, мынаны қос:
#      envVars: - key: DB_FILE
#                 value: /var/data/focusflow.db
#      disk:
#        name: focusflow-data
#        mountPath: /var/data
#        sizeGB: 1
#
# 2) SQLite орнына тегін Postgres (Neon/Supabase). Сонда тегін жоспар да
#    жеткілікті болады, бірақ server/db.js пен SQL сұраныстарды қайта жазу
#    керек.
services:
  - type: web
    name: focusflow
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '24'
